name: Deploy CI3

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-ci3-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload to production server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload project files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 72.60.76.60
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false
          exclude: |
            .env
            .git/**
            .github/**
            application/logs/**
            application/cache/**
            uploads/**
            php-server-8000.log
            php-server-8000.err.log

      - name: Fix writable directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.60.76.60
          username: root
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            mkdir -p application/logs application/cache uploads
            find application/logs application/cache uploads -type d -exec chmod 755 {} \;
            find application/logs application/cache uploads -type f -exec chmod 644 {} \;
            chmod 644 .htaccess index.php callback.php || true
